
---
- name: Deploy CRUD application with Docker and Nginx
  hosts: app
  become: true

  vars:
    app_dir: /opt/devops-crud-app
    app_image: isurumadusara/devops-crud-app:latest
    app_container: crud-app

  tasks:
    - name: Verify database password is available
      ansible.builtin.assert:
        that:
          - lookup('env', 'TF_VAR_db_password') | length >= 12
        fail_msg: "Configure the RDS password in Jenkins credentials."
      no_log: true

    - name: Create application configuration directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create application environment file
      ansible.builtin.copy:
        dest: "{{ app_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
        content: |
          PORT=3000
          DB_HOST=devops-crud-mysql.ch4sookcshwy.ap-south-1.rds.amazonaws.com
          DB_PORT=3306
          DB_NAME=tasksdb
          DB_USER=appadmin
          DB_PASSWORD={{ lookup('env', 'TF_VAR_db_password') }}
      no_log: true

    - name: Pull application image from Docker Hub
      ansible.builtin.command:
        cmd: "docker pull {{ app_image }}"

    - name: Remove previous application container if present
      ansible.builtin.command:
        cmd: "docker rm -f {{ app_container }}"
      failed_when: false
      changed_when: false

    - name: Start application container
      ansible.builtin.command:
        cmd: >-
          docker run -d
          --name {{ app_container }}
          --restart unless-stopped
          --env-file {{ app_dir }}/.env
          -p 127.0.0.1:3000:3000
          {{ app_image }}
      changed_when: true

    - name: Configure Nginx reverse proxy
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/crud-app
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable CRUD application Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/crud-app
        dest: /etc/nginx/sites-enabled/crud-app
        state: link
        force: true

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Validate Nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded

    - name: Wait for application health endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1/health
        status_code: 200
      register: health_check
      retries: 12
      delay: 5
      until: health_check.status == 200

